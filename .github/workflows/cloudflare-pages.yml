name: Static Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare deployment environment
        required: true
        type: choice
        default: preview
        options: [preview, production]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
      environment: ${{ steps.target.outputs.environment }}
      pages_branch: ${{ steps.target.outputs.pages_branch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: target
        run: node --experimental-strip-types scripts/deployment-target.ts

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm run worker:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: [quality, test, target]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ACTIVITY_API_URL: ${{ vars[needs.target.outputs.environment == 'production' && 'ACTIVITY_API_URL_PRODUCTION' || 'ACTIVITY_API_URL_PREVIEW'] }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify static routes
        run: |
          test -d out/_next
          for route in index hub sonicrelay/privacy-policy the-universe-decides/privacy-policy; do
            test -s "out/$route.html"
          done
          test -s out/404.html
          test -s out/sitemap.xml
          test -s out/robots.txt
          test -s out/favicon.svg
          test -s out/hugo-preview.png
      - uses: actions/upload-artifact@v7
        with:
          name: portfolio-static-${{ github.sha }}
          path: out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: [build, target]
    if: needs.target.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # The Worker and its matching Pages artifact publish under one shared lock.
    # Do not cancel an active deployment when another commit arrives.
    concurrency:
      group: portfolio-cloudflare-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: portfolio-static-${{ github.sha }}
          path: out/
      - name: Deploy Worker and Pages
        run: node --experimental-strip-types scripts/deploy-cloudflare.ts
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.target.outputs.environment }}
          PAGES_BRANCH: ${{ needs.target.outputs.pages_branch }}
          ACTIVITY_API_URL: ${{ vars[needs.target.outputs.environment == 'production' && 'ACTIVITY_API_URL_PRODUCTION' || 'ACTIVITY_API_URL_PREVIEW'] }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
